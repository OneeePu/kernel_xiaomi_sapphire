name: Build Sapphire kernel

on:
  workflow_dispatch:
    inputs:
      lto_mode:
        description: LTO mode for the kernel build
        required: true
        type: choice
        options:
          - thin
          - full
          - none
        default: thin
      build_jobs:
        description: Parallel build jobs
        required: true
        type: choice
        options:
          - '2'
          - '4'
        default: '4'
      package_anykernel:
        description: Package a flashable AnyKernel3 ZIP
        required: true
        type: boolean
        default: true
  push:
    branches:
      - dev
    paths-ignore:
      - 'ci/**'
      - 'anykernel/**'
      - '.github/workflows/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: sapphire-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64 GKI kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BUILD_JOBS: ${{ inputs.build_jobs || '4' }}
      LTO_MODE: ${{ inputs.lto_mode || 'thin' }}
      LLVM: '1'
      OUT_DIR: /tmp/sapphire-kernel-out
      DIST_DIR: /tmp/sapphire-kernel-dist

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio device-tree-compiler dwarves \
            flex kmod libelf-dev libncurses-dev libssl-dev \
            clang clang-14 lld llvm llvm-14 python3 rsync zip

      - name: Build kernel, DTBs, and modules
        run: bash ci/build-kernel.sh

      - name: Package AnyKernel3 ZIP for sapphire and sapphiren
        if: github.event_name == 'push' || inputs.package_anykernel
        run: bash ci/package-anykernel.sh

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sapphire-kernel-${{ github.sha }}
          path: /tmp/sapphire-kernel-dist/
          if-no-files-found: error
          retention-days: 14
